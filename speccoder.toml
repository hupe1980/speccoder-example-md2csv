# speccoder configuration — written by `speccoder init`; review it, then commit it
# (runs read the committed file in their worktree).

# Checks: speccoder runs them before and after every attempt and decides the
# verdict from them. `fast` runs per task; `full` at phase ends and `verify --tier full`.

# a Python project (pytest, uv run --locked --offline python)
[checks.test]
argv = ["uv", "run", "--locked", "--offline", "python", "-m", "pytest", "-q", "--junitxml=.speccoder/junit.xml"]
junit = ".speccoder/junit.xml"

# The model. The API key comes only from the environment (OPENAI_API_KEY).
[model]
provider = "openai"
model = "gpt-5.4-mini"
# price_input_per_mtok = 0.0       # USD per million tokens, for `speccoder report --cost`
# price_output_per_mtok = 0.0
# price_cache_read_per_mtok = 0.0

# Limits per attempt, and attempts per task (a failed verdict is retried once).
# [budget]
# max_turns = 30
# max_tool_calls = 100
# max_attempts = 2

# Test files that existed before an attempt: "ask" before any change (default), or
# "additions" to let new tests be added without asking (changed lines still ask).
# [tests]
# frozen = "additions"

# Commands run in an OS sandbox: writes only to the worktree, credentials unreadable,
# no network beyond loopback. Give commands that fetch the network, or switch it off.
# [sandbox]
# network_allow = [["cargo", "fetch"]]
# mode = "auto"           # "required" refuses to run unsandboxed; "off"

# Commands the model may run besides the checks (argv prefixes); others need approval.
[commands]
allow = [["uv", "run", "--locked", "--offline", "python", "-m", "pytest"]]

# A run's worktree gets Node and uv dependencies by their locked, offline install
# before the baseline. `include` copies git-ignored files from this checkout.
# [worktree]
# prepare = "auto"           # "off": never prepare
# include = [".env"]          # never committed, secret-named values masked
